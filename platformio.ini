; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Only the detection-mesh piece is actively maintained.
default_envs = sensor, screen, component_state_display, screen_extractor, screen_diorama, screen_party, screen_television, arbiter_mesh, bridge

; ── Shared library pins ───────────────────────────────────────────────────────
; FastLED is pinned, not floated. 3.10.5 ships a generic bit-banged fallback
; clockless controller (src/platforms/shared/clockless_blocking.h, a file 3.10.3
; does not have at all) and selects it on ESP32 instead of the RMT driver. The
; bit timing is wrong, every pixel latches garbage, and the strip comes up full
; bright white -- it announces itself on boot with "Using GENERIC fallback
; clockless controller", which is the line to look for if this ever returns.
;
; Float it and the failure is worse than an upgrade: existing envs keep whatever
; is cached in .pio/libdeps, so only a NEWLY ADDED env gets the bad version and
; the symptom reads as "the board I just added is white" rather than as a
; library change. Pinned here, every env resolves the same.
[common]
fastled = fastled/FastLED @ 3.10.3

; ── Shared defaults (applied to all envs) ─────────────────────────────────────
[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
monitor_filters = time
extra_scripts = pre:tools/build_hash.py

; ══ DEPRECATED: BLE traveler/station/arbiter piece ════════════════════════════
; Superseded by the detection-mesh piece below. Kept so the boards can still be
; reflashed, but no longer built by default and not maintained -- expect these
; to rot. Do not add features here; new work goes in the mesh envs.

; ── Traveler: ESP32-S3 (custom 4MB/2MB board), BLE advertiser + LED matrix ────
; DEPRECATED -- see note above.
[env:traveler]
board = esp32s3_4mb_2mbpsram
board_dir = boards
build_flags =
	-D PULLEYS_ENV='"${this.__env__}"'
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D BOARD_HAS_PSRAM
	-D PULLEYS_DEVICE_TYPE=PULLEYS_TYPE_TRAVELER
	-D LED_PIN=14
	-D LED_COUNT=64
lib_deps =
	${common.fastled}
	h2zero/NimBLE-Arduino
build_src_filter = +<traveler/>

; ── Station: Seeed XIAO ESP32-C3, BLE scanner + 8x32 LED matrix ───────────────
; DEPRECATED -- see note above.
[env:station]
board = seeed_xiao_esp32c3
build_flags =
	-D PULLEYS_ENV='"${this.__env__}"'
	-D PULLEYS_DEVICE_TYPE=PULLEYS_TYPE_STATION
	-D LED_PIN=10
	-D LED_COUNT=256
	-D PULLEYS_SSAA=1
lib_deps =
	${common.fastled}
	h2zero/NimBLE-Arduino
build_src_filter = +<station/>

; ── Station WROOM: D1 Mini ESP32-WROOM-32, full SSAA (hardware FPU) ───────────
; DEPRECATED -- see note above.
[env:station_wroom]
board = wemos_d1_mini32
build_flags =
	-D PULLEYS_ENV='"${this.__env__}"'
	-D PULLEYS_DEVICE_TYPE=PULLEYS_TYPE_STATION
	-D LED_PIN=16
	-D LED_COUNT=256
	-D PULLEYS_SSAA=3
lib_deps =
	${common.fastled}
	h2zero/NimBLE-Arduino
build_src_filter = +<station/>
; CH340: see the note on [env:screen].
monitor_dtr = 0
monitor_rts = 0

; ── Arbiter: ESP32-S3 (16MB/8MB PSRAM), 4.3" 800×480 RGB LCD, LVGL display ──
; DEPRECATED -- see note above. The mesh monitor is [env:arbiter_mesh] below.
[env:arbiter]
board = esp32s3_16mb_8mbpsram
board_dir = boards
build_flags =
	-D PULLEYS_ENV='"${this.__env__}"'
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D BOARD_HAS_PSRAM
	-D PULLEYS_DEVICE_TYPE=PULLEYS_TYPE_ARBITER
	-D LV_CONF_INCLUDE_SIMPLE
	-I include
lib_deps =
	lovyan03/LovyanGFX @ ^1.1.9
	lvgl/lvgl @ ^8.4.0
	h2zero/NimBLE-Arduino
	${common.fastled}
build_src_filter = +<arbiter/>

; ══ Detection-mesh piece ══════════════════════════════════════════════════════
; Sensor + Screen talk over ESP-NOW broadcast on one fixed WiFi channel.
; No AP, no pairing. Every node relays unseen events (flood, TTL, dedupe).

; ── Sensor: ESP32-S3 (traveler board), IMU motion detection → mesh event ──────
[env:sensor]
board = esp32s3_4mb_2mbpsram
board_dir = boards
build_flags =
	-D PULLEYS_ENV='"${this.__env__}"'
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D BOARD_HAS_PSRAM
	-D PULLEYS_DEVICE_TYPE=PULLEYS_TYPE_SENSOR
	-D LED_PIN=14
; Standard WS2812B wire order. The role used to hardcode RGB, which permuted
; every hue on this hardware -- channel 11's purple came out green.
	-D LED_COLOR_ORDER=GRB
; Two surfaces on the one output: the 8x8 panel (64) and a 14x2 bar chained
; after it (29 -- 14, skip 1, 14). main.cpp static_asserts that this covers
; both, so a count that stops short fails to build instead of rendering off
; the end of the array.
	-D LED_COUNT=93
	-D MESH_WIFI_CHANNEL=1
lib_deps =
	${common.fastled}
build_src_filter = +<sensor/>
; Two 1.9MB app slots, so a board can be reflashed over the air. default.csv's
; 1.25MB slots are the Arduino fallback and leave no room to grow into.
board_build.partitions = min_spiffs.csv

; ── Screen: D1 Mini ESP32-WROOM-32 (dual-core), 8x32 activity display ─────────
; Dual-core matters: WiFi/mesh on core 0, FastLED's interrupt-off window on 1.
; Everything about a screen except its env name, so a variant env can inherit
; the hardware without inheriting the -D PULLEYS_ENV that names this one -- a
; board has to report the image it is actually running.
; LED_COUNT is NOT here: it describes the surface on the output, not the role,
; and the surfaces differ -- 256 for the 8x32 matrix, 29 for a 14x2 panel.
[screen_common]
build_flags =
	-D PULLEYS_DEVICE_TYPE=PULLEYS_TYPE_SCREEN
	-D LED_PIN=16
	-D PULLEYS_SSAA=3
	-D MESH_WIFI_CHANNEL=1

[env:screen]
board = wemos_d1_mini32
build_flags =
	${screen_common.build_flags}
	-D PULLEYS_ENV='"${this.__env__}"'
	-D LED_COUNT=256
lib_deps =
	${common.fastled}
build_src_filter = +<screen/>
board_build.partitions = min_spiffs.csv
; The CH340 asserts DTR/RTS on open, which drives the auto-reset circuit and
; holds the chip in reset -- the monitor then shows a blank screen forever and
; looks like a dead board. tools/identify.py deasserts both for the same reason.
monitor_dtr = 0
monitor_rts = 0

; ── Component state display: the screen image, pinned to the charge bars ────
; Not a role of its own any more: a Screen running its COMPONENTS display (any
; screen can, via DISPLAY_ASSIGNMENT in lib/pulleys_install). This env exists
; for the board already installed as one -- the firmware updater only offers a
; board the env it reports, so dropping it would strand that board on an image
; nothing updates. Same code, board and mesh as [env:screen]; the display is
; pinned the way [env:screen_allon] pins its own.
; The panel this was built for is mounted so its bars fill the other way from
; the default, hence REVERSE_Y. Flip with -D COMPONENT_DISPLAY_REVERSE_X=1 /
; COMPONENT_DISPLAY_REVERSE_Y=1 if they come out mirrored or upside down.
[env:component_state_display]
extends = env:screen
build_flags =
	${screen_common.build_flags}
	-D PULLEYS_ENV='"${this.__env__}"'
	-D LED_COUNT=256
	-D SCREEN_FORCE_DISPLAY=pulleys::SCREEN_COMPONENTS
	-D COMPONENT_DISPLAY_REVERSE_Y=1

; ── Screen all-on: the screen image, built to hold every pixel lit ───────────
; Same code, same mesh and same board as [env:screen] -- only the display is
; pinned, to ALLON, which overrides whatever the install map says for this
; board. For looking at a panel: dead pixels, dark blocks, a colour channel
; that never comes up, a feed that sags under load. Put the board back with
; `./flash_all.sh --install`.
[env:screen_allon]
extends = env:screen
build_flags =
	${screen_common.build_flags}
	-D PULLEYS_ENV='"${this.__env__}"'
	-D LED_COUNT=256
	-D SCREEN_FORCE_DISPLAY=pulleys::SCREEN_ALLON

; ── Screen 14x2 wave: the screen image on a folded 29-LED strip ───────────────
; A different LED surface, not just a different display: 14 pixels out, one dead
; pixel at the fold, 14 back (lib/pulleys_panel). The screen's own displays all
; address the 8x32 matrix, so this env pins WAVE and sizes LED_COUNT to the
; strip; main.cpp static_asserts that those two agree. Still a full Screen on
; the mesh -- it relays like any other, it just does not draw activity.
[env:screen_wave]
extends = env:screen
build_flags =
	${screen_common.build_flags}
	-D PULLEYS_ENV='"${this.__env__}"'
	-D LED_COUNT=29
	-D SCREEN_FORCE_DISPLAY=pulleys::SCREEN_WAVE

; ── Screen extractor: the screen image on a ring and a hanging strip ─────────
; Its own LED surface, one chain: two 32x8 panels bent into a 64x8 ring (512),
; then a strip hanging below it, first LED at the top. Runs only the five
; EXTRACTOR displays -- one per colour but purple -- and which colour comes
; from DISPLAY_ASSIGNMENT (SCREEN_EXTRACTOR_RED .. _ORANGE); an unlisted board
; steps to the next colour each power cycle. Set EXTRACTOR_STRIP_LEDS to the
; strip actually hung, and LED_COUNT to 512 plus it -- main.cpp static_asserts
; the two agree. Flip with -D EXTRACTOR_REVERSE_Y=1 / EXTRACTOR_STRIP_REVERSE=1
; if the ring or the strip fills the wrong way.
; LED_MAX_MA is raised from the screen's USB-safe 450: a full extractor is
; ~570 pixels lit, and at 450 mA FastLED would dim the whole thing to a glow
; just as it filled. This assumes the surface has its own 5 V supply.
[env:screen_extractor]
extends = env:screen
build_flags =
	${screen_common.build_flags}
	-D PULLEYS_ENV='"${this.__env__}"'
	-D EXTRACTOR_STRIP_LEDS=60
	-D LED_COUNT=572
	-D LED_MAX_MA=2500

; ── Screen diorama: fluorescent tubes, a door latch and a door sensor ─────────
; The screen image on one LED strip, pinned to DIORAMA: 8 lit / 3 dark tubes in
; a cold blue-green white. The game drives it with the device settings
; diorama.lights (dark|creepy) and diorama.latch (locked|open), and hears
; diorama.door_opened / door_closed / button_pressed back (DEVELOPING.md,
; "Device settings"). DIORAMA_LEDS is the strip's length and marks the build;
; LED_COUNT has to cover it. GPIO 18 (D18) drives the latch's SSR, HIGH to
; unlock; GPIO 27 reads the door switch and GPIO 25 the "free the spirits"
; button (both pull-up). Polarity: -D DIORAMA_LATCH_UNLOCK=LOW for a lock that power holds
; shut (a maglock), -D DIORAMA_DOOR_OPEN=LOW for a switch that closes when the
; door opens. LED_MAX_MA assumes the strip has its own 5 V supply.
[env:screen_diorama]
extends = env:screen
build_flags =
	${screen_common.build_flags}
	-D PULLEYS_ENV='"${this.__env__}"'
	-D DIORAMA_LEDS=120
	-D LED_COUNT=120
	-D LED_PIN=13
	-D SCREEN_FORCE_DISPLAY=pulleys::SCREEN_DIORAMA
	-D LED_MAX_MA=2500

; ── Screen party: four AC light switches, on for the victories ───────────────
; The screen image on a classic 30-pin ESP32 DevKit, with no LEDs: four outputs
; each drive a switch (SSR or relay module) for a string of the room's lights.
; The game drives them with the device setting party.lights (dark|lit); they
; come on 200 ms apart.
; PARTY_PINS names the four outputs and marks the build; GPIO 32/33/25/26 are
; plain outputs with no boot-strapping role. -D PARTY_ON=LOW for an active-low
; relay board. The DevKit's blue LED (GPIO 2) shows whether the lights are on.
; LED_COUNT=1 only because the shared code keeps an LED array; nothing drives it.
[env:screen_party]
extends = env:screen
board = esp32dev
build_flags =
	${screen_common.build_flags}
	-D PULLEYS_ENV='"${this.__env__}"'
	-D PARTY_PINS=32,33,25,26
	-D LED_COUNT=1
	-D SCREEN_FORCE_DISPLAY=pulleys::SCREEN_PARTY

; ── Screen television: the diorama's TV set, on an arbiter's 4.3" LCD board ───
; A Screen on the mesh (relays, census, firmware updates), but its own image:
; the hardware is [env:arbiter_mesh]'s Waveshare ESP32-S3-Touch-LCD-4.3, not an
; LED surface. Shows text on a solid colour, cycling through the messages in
; src/television/messages.h. Panel pins and timing are lib/pulleys_lcd, shared
; with the arbiter. No LVGL: LovyanGFX draws each frame whole into PSRAM.
[env:screen_television]
board = esp32s3_16mb_8mbpsram
board_dir = boards
build_flags =
	-D PULLEYS_ENV='"${this.__env__}"'
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D BOARD_HAS_PSRAM
	-D PULLEYS_DEVICE_TYPE=PULLEYS_TYPE_SCREEN
	-D MESH_WIFI_CHANNEL=1
lib_deps =
	lovyan03/LovyanGFX @ ^1.1.9
build_src_filter = +<television/>
board_build.partitions = default_16MB.csv

; ── Bridge: ESP32-C3 (4MB, native USB), mesh events to a Pi ──────────────────
; Joins the mesh like any other node (relays, answers census, serves firmware
; on the Overlord's) and writes events and cues to its Pi. Any C3 board with
; native USB and 4 MB of flash runs this image.
; The Pi link is the native USB port: one cable from the Pi for power and data,
; shared with the console (src/bridge explains how the two are kept apart).
; For a Pi on its GPIO UART instead, build with -D BRIDGE_PI_USB=0: the link
; moves to UART1 on GPIO 21 = TX, 20 = RX (GPIO 18/19 are the USB data lines and
; must not be used). Override with -D BRIDGE_TX_PIN / BRIDGE_RX_PIN / BRIDGE_BAUD.
; Always a C3: the bridge has no LEDs, so nothing ties it to a bigger chip.
[env:bridge]
monitor_speed = 921600
board = seeed_xiao_esp32c3
build_flags =
	-D PULLEYS_ENV='"${this.__env__}"'
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D PULLEYS_DEVICE_TYPE=PULLEYS_TYPE_BRIDGE
	-D MESH_WIFI_CHANNEL=1
	-D BRIDGE_TX_PIN=21
	-D BRIDGE_RX_PIN=20
build_src_filter = +<bridge/>
board_build.partitions = min_spiffs.csv

; Classic ESP32 bridge with a USB-UART adapter. Keep its image separate from
; the native-USB C3 bridge so managed updates cannot cross-flash the chips.
[env:bridge_esp32]
monitor_speed = 921600
board = esp32dev
build_flags =
	-D PULLEYS_ENV='"${this.__env__}"'
	-D PULLEYS_DEVICE_TYPE=PULLEYS_TYPE_BRIDGE
	-D MESH_WIFI_CHANNEL=1
build_src_filter = +<bridge/>
board_build.partitions = min_spiffs.csv
monitor_dtr = 0
monitor_rts = 0

; ── Arbiter Mesh: ESP32-S3 + 4.3" 800x480 LCD, 4-quadrant mesh monitor ───────
; Joins the detection mesh as an observer and shows sensors, screens, channel
; activity and a live event log. Replaces the deprecated BLE `arbiter`.
[env:arbiter_mesh]
board = esp32s3_16mb_8mbpsram
board_dir = boards
build_flags =
	-D PULLEYS_ENV='"${this.__env__}"'
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D BOARD_HAS_PSRAM
	-D PULLEYS_DEVICE_TYPE=PULLEYS_TYPE_ARBITER
	-D LV_CONF_INCLUDE_SIMPLE
	-D MESH_WIFI_CHANNEL=1
	-I include
lib_deps =
	lovyan03/LovyanGFX @ ^1.1.9
	lvgl/lvgl @ ^8.4.0
	bblanchon/ArduinoJson @ ^7.4.2
	${common.fastled}
extra_scripts = ${env.extra_scripts}, pre:tools/embed_game.py
build_src_filter = +<arbiter_mesh/>
; 16MB board: 6.5MB app slots, which LVGL + LovyanGFX need room inside of.
board_build.partitions = default_16MB.csv

; ── Arbiter on an Elecrow CrowPanel Advance 7" (ESP32-S3 N16R8, 800x480) ─────
; Same firmware as arbiter_mesh; only the panel pins/timing differ, and an STC8
; at I2C 0x30 owns backlight + touch power; BM8563 RTC. No SD log here.
; USB is a CH340K (PID 0x7522), which macOS's built-in driver does not match:
; install WCH's CH34xVCPDriver for a /dev/cu.* port.
[env:arbiter_crowpanel7]
extends = env:arbiter_mesh
; The only USB link is the CH340 on UART0, so Serial must not go to native USB.
build_flags =
	-D PULLEYS_ENV='"${this.__env__}"'
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=0
	-D BOARD_HAS_PSRAM
	-D PULLEYS_DEVICE_TYPE=PULLEYS_TYPE_ARBITER
	-D LV_CONF_INCLUDE_SIMPLE
	-D MESH_WIFI_CHANNEL=1
	-D ARBITER_BOARD_CROWPANEL7
	-I include
