# Example game. Format reference: GAME_FORMAT.md
#
# GLOSSARY
#   cue          Something the panel does: play a sound, play a video clip, or
#                switch the background music or video. The name starts with its
#                kind, and the whole name is the file name in overlord/media/
#                (the part after the kind also works):
#                  audio_loop_*  background music; repeats until changed
#                  audio_once_*  a short sound effect played on top of everything
#                  video_loop_*  background video; repeats until changed
#                  video_once_*  a short video that plays once on screen. One
#                                fired by `enter` cuts off a clip already playing;
#                                one fired for an event is dropped if a clip is
#                                playing.
#                A * in a cue name plays one of the files it matches, at random
#                (never the same twice running): video_once_janis_nag_* is any
#                janis_nag_ clip.
#   event        Something that happens in the world, which a state can react to:
#                  first_goal_component_activated  A goal activates while no goal is lit.
#                  goal_component_activated     A goal component is activated.
#                  nongoal_component_activated  A major component outside the goal set is activated.
#                  component_deactivated       One of the major components is deactivated.
#                  all_components_activated    All goals lit; every non-goal dark.
#                  all_components_deactivated  Every major component is now deactivated.
#                  final_component_activated   A final (purple) channel is activated.
#                  final_component_deactivated A final (purple) channel is deactivated.
#                  all_final_components_activated  Every purple channel with a rope is now lit.
#   state        What the game is doing right now. It is always in exactly one.
#   on           What to do when a state is entered or an event happens in it.
#                An event a state does not list is ignored.
#   enter        Cues to fire the moment the game arrives in a state.
#   cue (in on)  Cues to fire for that event. An entry in any cue list may be
#                `choose_one:` with a list under it; one of those fires, picked
#                at random each time.
#   idle         A state's cues to fire after `delay` with no pull, then again
#                every `delay` until a pull comes. A pull on any rope counts.
#   goto         The state to move to.
#   after        Move to another state once this much time has passed.
#   component    One of the pieces of the installation that players activate: five
#                major ones, each a colour driven by every rope wearing it, and
#                the final ones -- every channel painted purple is one.
#   decay rate   Percent of full charge a component loses per second.
#   charge       How full a component is, 0-100. Pulls add to it, time drains it.
#   ambient      A sound overlord repeats on a schedule, independent of the game.
#   gain         A multiplier on how loud one audio clip plays. 1 is unchanged.
#   placeholder  Media that does not exist yet.

game: pulley-party
start: passive

# Which colour drives each major component. The position in the list is the
# component's number, so the first entry is major component 1. The five majors
# are game1's colours -- red, blue, green, yellow, orange, each once -- and a
# pull on any rope wearing that colour today (set on the arbiter's COLOURS
# screen) drives it. The order also fixes the order of the bars on the component
# state display. The finals are not listed: every purple channel is a final, and
# game2 is won when all the purple channels with a rope on them are lit.
components:
  major:
    - red
    - blue
    - green
    - yellow
    - orange

# The devices the game drives besides the media: what each can be set to, and
# what each can tell the game. A state changes a setting with `set:`, and it
# holds until another `set:` changes it -- the arbiter keeps broadcasting the
# whole table, so a device that reboots or misses a packet catches up within a
# second. The first value listed is where a setting starts. A device that hears
# nothing from the arbiter for 12 s falls back on its own to safe: lights out,
# door locked. Values are words; YAML reads a bare on/off/yes/no as true/false,
# so those would need quoting -- easier to pick other words.
#
# An input a device emits is an event like any other, named device.input:
# `on: diorama.door_opened:` in a state reacts to it.
devices:
  diorama:                          # the diorama's tubes, its door latch and door switch
    set:
      lights: [dark, creepy]
      latch: [locked, open]
    emits: [door_opened, door_closed]
  party:                            # the four AC light switches
    set:
      lights: [dark, lit]

# How fast a component's charge drains, in percent of full per second. Pulls
# fill it (charge_per_pull below); it lights at 100 and goes dark at 0, so
# once full and left alone it stays lit 100 / rate seconds: 6.6667 is 15
# seconds. The arbiter owns this, and publishes it to the component state
# displays along with each component's charge. It applies to every component
# (hence "default").
default_decay_rate: 6.6667

# How much one pull adds to a component's charge, in percent of full. Below 100
# so no single pull lights anything: it takes pulls coming faster than the
# drain. At 20 against 6.6667, six quick pulls (two a second) fill one, and a
# lone rope pulled once every three seconds only just holds its level.
charge_per_pull: 20

# Sounds overlord plays on its own, forever, whatever state the game is in.
# Only overlord reads this; the arbiter never sees it. Each entry plays its
# sound every `interval` seconds, give or take up to `variance` seconds (picked
# fresh each time), so 5 and 1 plays every 4 to 6 seconds.
ambient_sounds:
  - sound: audio_once_steam
    interval: 20
    variance: 1

# How loud clips should be relative to each other. Read ONLY by
# tools/balance_audio.py, which uses it to work out audio_gain below; no device
# reads it. A key is a whole folder (audio_loop, audio_once) or one cue
# (audio_loop_idle), and the cue wins over its folder. Unlisted is 1, so 0.6
# puts a clip at 60% of the loudness the others are balanced to.
audio_weights:
  audio_loop: 0.6

# How loud each audio clip plays, as a multiplier on the file's own level (on
# top of the volume setting): 1.2 is 20% louder, 0.8 is 80% as loud. Optional;
# a cue not listed plays at 1. Only overlord reads this. Keys are cue names.
audio_gain:
  audio_loop_idle: 0.89
  audio_once_steam: 0.6
  audio_once_component_powerup: 1  # placeholder
  audio_once_component_powerdown: 1.17  # placeholder
  audio_once_encouragement: 1.45

# CUES
#   Cues travel over the mesh as their name in ASCII, e.g. audio_once_chime,
#   so a name has to fit one packet: 1 to 63 characters, lowercase letters,
#   digits, _, - and * (a wildcard, see the glossary). This block lists every
#   cue the game may use; a state that
#   fires a cue not listed here is rejected. Order does not matter.
cues:
  game:
    - game_reset_components
    - game_randomize_simon_1_goals
    - game_randomize_simon_2_goals
    - game_randomize_simon_3_goals
    - game_randomize_simon_4_goals
    - game_randomize_simon_5_goals
  audio_loop:
    - audio_loop_idle
    - audio_loop_off
  video_once:
    - video_once_test1
    - video_once_test2
    - video_once_encouragement      # placeholder
    # Janis clips, from the drive. One wildcard cue per mood plays a random take
    # of that mood; below them, one line per file, the comment is what she says.
    - video_once_janis_encouragement_*
    - video_once_janis_progress_confirmation_*
    - video_once_janis_nag_*
    - video_once_janis_suspicion_*
    - video_once_janis_warn_*
    - video_once_janis_beg_*
    - video_once_janis_anger_*
    - video_once_janis_threatening_*
    - video_once_janis_panic_*
    # janis_encouragement (13)
    - video_once_janis_encouragement_good_work_1  # Keep up the good work.
    - video_once_janis_encouragement_rewarded_1  # If you do a good job, you will be handsomely rewarded.
    - video_once_janis_encouragement_rewarded_2  # If you do a good job, you're going to be handsomely rewarded.
    - video_once_janis_encouragement_doing_great  # You're doing great.
    - video_once_janis_encouragement_awesome_job_1  # You're doing an awesome job.
    - video_once_janis_encouragement_productivity  # We love your productivity.
    - video_once_janis_encouragement_awesome_job_2  # You're doing an awesome job.
    - video_once_janis_encouragement_keep_going  # Keep going.
    - video_once_janis_encouragement_dont_worry  # Don't worry. You're doing a good job.
    - video_once_janis_encouragement_awesome_job_3  # You're doing an awesome job.
    - video_once_janis_encouragement_good_work_2  # Keep up the good work.
    - video_once_janis_encouragement_great_job  # You're doing a great job.
    - video_once_janis_encouragement_awesome_job_4  # You're doing an awesome job.
    # janis_progress_confirmation (11)
    - video_once_janis_progress_confirmation_yes  # Yes!
    - video_once_janis_progress_confirmation_thats_it  # Yes, that's it.
    - video_once_janis_progress_confirmation_essences_1  # You're on your way to collecting the necessary essences.
    - video_once_janis_progress_confirmation_essences_2  # You're on your way to collecting the necessary essences.
    - video_once_janis_progress_confirmation_congrats_1  # Congratulations!
    - video_once_janis_progress_confirmation_celebration_1  # Please enjoy your celebration.
    - video_once_janis_progress_confirmation_pizza_1  # Pizza's on the way.
    - video_once_janis_progress_confirmation_congrats_2  # Congratulations!
    - video_once_janis_progress_confirmation_celebration_2  # Please enjoy your celebration.
    - video_once_janis_progress_confirmation_pizza_2  # Pizza's on the way!
    - video_once_janis_progress_confirmation_congrats_3  # Congratulations!
    # janis_nag (7)
    - video_once_janis_nag_thread  # Don't drop the thread.
    - video_once_janis_nag_thread_whatever  # Whatever you do, don't drop the thread.
    - video_once_janis_nag_unraveled  # Don't let things come unraveled.
    - video_once_janis_nag_maintain_1  # Maintain productivity.
    - video_once_janis_nag_maintain_2  # Please maintain productivity.
    - video_once_janis_nag_maintain_3  # Please maintain your productivity.
    - video_once_janis_nag_essences  # Keep those essences moving.
    # janis_suspicion (4)
    - video_once_janis_suspicion_deadlines  # It seems like you might be missing some of your deliverable deadlines.
    - video_once_janis_suspicion_what_doing_1  # What are you doing?
    - video_once_janis_suspicion_what_doing_2  # What are you doing?
    - video_once_janis_suspicion_what_doing_3  # What are you doing?
    # janis_warn (4)
    - video_once_janis_warn_authorized_1  # That's for authorized personnel only.
    - video_once_janis_warn_dont_go_in  # Don't go in there.
    - video_once_janis_warn_authorized_2  # That's for authorized personnel only.
    - video_once_janis_warn_dont_look  # Don't look in there.
    # janis_beg (5)
    - video_once_janis_beg_back_to_work_1  # Get back to work.
    - video_once_janis_beg_ignore_that  # Ignore that. Stay away. Get back to work.
    - video_once_janis_beg_back_to_work_2  # Get back to work.
    - video_once_janis_beg_please_work  # Please get back to work.
    - video_once_janis_beg_button  # That button has been disabled. Now get back to work.
    # janis_anger (3)
    - video_once_janis_anger_no_1  # No!
    - video_once_janis_anger_no_2  # No!
    - video_once_janis_anger_stop_it  # Stop it. Get out of there.
    # janis_threatening (4)
    - video_once_janis_threatening_disciplinary_1  # If you don't return to work, it may result in disciplinary action.
    - video_once_janis_threatening_disciplinary_2  # If you don't... if you don't return to work, it may result in disciplinary action.
    - video_once_janis_threatening_disciplinary_3  # If you don't return to work, it may result in disciplinary action.
    - video_once_janis_threatening_disciplined  # Please maintain productivity and get back to work or you will be disciplined.
    # janis_panic (5)
    - video_once_janis_panic_imminent  # Disciplinary action is imminent.
    - video_once_janis_panic_terminated  # If you don't stop immediately, you will be terminated.
    - video_once_janis_panic_unraveled  # Things will come unraveled if you continue.
    - video_once_janis_panic_sabotaging  # You're sabotaging our productivity.
    - video_once_janis_panic_immediately  # Get back to work immediately.
  audio_once:
    - audio_once_steam
    - audio_once_component_powerup  # placeholder
    - audio_once_component_powerdown  # placeholder
    - audio_once_encouragement
    - audio_once_progress_confirmation
    - audio_once_corporate_approval
    - audio_once_productivity_score_rises
    - audio_once_victory_fanfare
    - audio_once_revelation_stinger
    - audio_once_spirit_distress
    - audio_once_spirit_forced_labor
    - audio_once_janis_suspicion
    - audio_once_janis_anger
    - audio_once_spirit_encouragement
    - audio_once_janis_threatening
    - audio_once_cage_unlocking
    - audio_once_victory_liberation
    - audio_once_overlord_defeat
    - audio_once_machine_shutdown
    - audio_once_idle_return_cue
  video_loop:
    - video_loop_idle
    - video_loop_game1

# Flow: passive -> easy_round -> medium_round -> hard_round -> party -> final -> victory2 -> kickout -> passive
#
# Janis: encouragement for every correct component in the rounds, nagging when
# the ropes go quiet, and an escalating reaction to purple (warn, beg, anger)
# as the rounds go on. The party is her congratulations. In the final phase she
# is past that: threats when idle, panic at every purple, and nothing at all for
# the majors. Her clips carry their own voice, so no audio_once Janis cues here.
#
# Delays marked placeholder are not final timings yet.
states:

  passive:
    on:
      enter:
        set:                          # the game is back at its start
          diorama.lights: dark
          diorama.latch: locked
          party.lights: dark
        cue:
          - audio_loop_idle
          - video_loop_idle
      nongoal_component_activated:
        cue:
          - audio_once_component_powerup
          - video_once_janis_encouragement_*
        goto: easy_round

  easy_round:
    on:
      enter:
        cue:
          - game_reset_components
          - game_randomize_simon_2_goals
          - video_loop_game1
      goal_component_activated:
        cue:
          - audio_once_component_powerup
          - video_once_janis_encouragement_*
      component_deactivated:
        cue:
          - audio_once_component_powerdown
      final_component_activated:
        cue:
          - video_once_janis_warn_*
      all_components_activated:
        goto: medium_round
    idle:
      delay: 20s                    # placeholder
      cue:
        - video_once_janis_nag_*
    after:
      delay: 2m                     # placeholder
      goto: passive

  medium_round:
    on:
      enter:
        cue:
          - game_reset_components
          - game_randomize_simon_3_goals
          - video_loop_game1
          - choose_one:               # the round just won; on enter so it cuts
              - video_once_janis_progress_confirmation_yes        # off the last
              - video_once_janis_progress_confirmation_thats_it   # encouragement
              - video_once_janis_progress_confirmation_essences_1
              - video_once_janis_progress_confirmation_essences_2
      goal_component_activated:
        cue:
          - audio_once_component_powerup
          - video_once_janis_encouragement_*
      component_deactivated:
        cue:
          - audio_once_component_powerdown
      final_component_activated:
        cue:
          - video_once_janis_beg_*
      all_components_activated:
        goto: hard_round
    idle:
      delay: 20s                    # placeholder
      cue:
        - video_once_janis_nag_*
    after:
      delay: 2m                     # placeholder
      goto: passive

  hard_round:
    on:
      enter:
        cue:
          - game_reset_components
          - game_randomize_simon_5_goals
          - video_loop_game1
          - choose_one:               # the round just won; on enter so it cuts
              - video_once_janis_progress_confirmation_yes        # off the last
              - video_once_janis_progress_confirmation_thats_it   # encouragement
              - video_once_janis_progress_confirmation_essences_1
              - video_once_janis_progress_confirmation_essences_2
      goal_component_activated:
        cue:
          - audio_once_component_powerup
          - video_once_janis_encouragement_*
      component_deactivated:
        cue:
          - audio_once_component_powerdown
      final_component_activated:
        cue:
          - video_once_janis_anger_*
      all_components_activated:
        goto: party
    idle:
      delay: 20s                    # placeholder
      cue:
        - video_once_janis_nag_*
    after:
      delay: 2m                     # placeholder
      goto: passive

  # The celebration between the rounds and the final phase. Entry plays one
  # congratulations; the party chatter (celebration, pizza) comes from the idle
  # timer, since enter cues cut each other off and only the last would play.
  # No new video loop yet: game1 stays behind her.
  party:
    on:
      enter:
        set:
          party.lights: lit
        cue:
          - choose_one:
              - video_once_janis_progress_confirmation_congrats_1
              - video_once_janis_progress_confirmation_congrats_2
              - video_once_janis_progress_confirmation_congrats_3
    at:
      10s:                          # the diorama comes on 10 s into the celebration
        set:
          diorama.lights: creepy
          diorama.latch: open
    idle:
      delay: 12s                    # placeholder
      cue:
        - choose_one:
            - video_once_janis_progress_confirmation_celebration_1
            - video_once_janis_progress_confirmation_celebration_2
            - video_once_janis_progress_confirmation_pizza_1
            - video_once_janis_progress_confirmation_pizza_2
    after:
      delay: 60s                    # placeholder
      goto: final

  # Only purple matters now. The majors are not listed, so a pull on one does
  # nothing: no powerup or powerdown sound, no Janis.
  final:
    on:
      enter:
        set:
          party.lights: dark          # the victory is over
        cue:
          - game_reset_components
          - video_once_janis_threatening_*
      final_component_activated:
        cue:
          - video_once_janis_panic_*
      all_final_components_activated:
        goto: victory2
    idle:
      delay: 20s                    # placeholder
      cue:
        - video_once_janis_threatening_*
    after:
      delay: 2m                     # placeholder
      goto: kickout

  victory2:
    on:
      enter:
        set:
          diorama.lights: dark
          diorama.latch: locked
          party.lights: lit
        cue:
          - video_once_test2        # placeholder
    after:
      delay: 2m                    # placeholder
      goto: kickout

  kickout:
    on:
      enter:
        set:
          party.lights: dark
        cue:
          - audio_loop_off
    after:
      delay: 2m                    # placeholder
      goto: passive
