# Example game. Format reference: GAME_FORMAT.md
#
# GLOSSARY
#   cue        audio_loop_* | audio_once_* | video_loop_* | video_once_*; name = file in
#              overlord/media/. `*` = random match, never the same twice running.
#              video_once from `enter` cuts off a playing clip; from an event it's dropped.
#   event      goal_component_activated, first_goal_component_activated,
#              nongoal_component_activated, component_deactivated,
#              all_components_activated (goals lit, non-goals dark),
#              all_components_deactivated, final_component_activated/deactivated,
#              all_final_components_activated (every roped purple channel lit)
#              pulls: pull, goal_pull, nongoal_pull, final_pull, and nongoal_<colour>_pull
#              (nongoal_red_pull ...) for a non-goal major's rope, by its colour
#   on         per-state reactions; unlisted events ignored
#   enter      cues on arrival
#   choose_one a list entry in any cue list; fires one at random
#   idle       cues after `delay` with no pull, repeating until a pull
#   every      cues every `delay` whatever happens; a list of them is fine, and an
#              entry may say `if: goal_active | no_goal_charge`
#   after      goto another state after this long
#   charge     0-100; pulls add, decay drains
#   gain       volume multiplier for a clip, 1 = unchanged

game: pulley-party
start: passive

# Goal band on the video while a round is on; extractors outline goals too.
show_goals: true

# Satellite Pis that play cues of their own (overlord/README.md, "Satellite players").
# diorama = overlord2: shows "Compliance is Mandatory" and plays the spirits' distress.
players:
  - diorama

# Major component colours; list position = component number (also bar order on displays).
# Finals aren't listed: every purple channel is one.
components:
  major:
    - red
    - blue
    - green
    - yellow
    - orange

# Devices: `set:` in a state holds until changed; first value is the default. Arbiter
# rebroadcasts the table; a device deaf for 12 s goes safe (lights out, door locked).
# Quote on/off/yes/no (YAML bools). Inputs are events named device.input.
devices:
  diorama:                          # its tubes, door latch, door switch, and the button inside
    set:
      lights: [dark, creepy, paradise]   # paradise: slow rainbow fades, for the spirits freed
      latch: [locked, open]
    emits: [door_opened, door_closed, button_pressed]
  party:                            # the four AC light switches
    set:
      lights: [dark, lit]
  television:                       # the TV set in the diorama: text on colour (src/television)
    set:
      channel: [idle, dark, janis, paradise]   # a channel of messages.h; dark = screen off
  queue:                            # the arbiter's own screen, as a sign for the line outside
    set:
      sign: [enter, wait, closed]   # a channel of src/arbiter_mesh/sign_messages.h

# $name works wherever a delay or count goes. min/max = a knob the tuner/director may
# move live (PARAM name value on the arbiter serial); applies on next read. No range =
# constant. Durations: 20s, 2m.
params:
  charge_per_pull:
    value: 40
    min: 10
    max: 60
    note: percent of full charge one pull adds
  final_charge_per_pull:
    value: 24
    min: 10
    max: 60
    note: percent of full charge one purple pull adds; lower than charge_per_pull, so the purple levers take about twice the pulls (4 -> 8 pulls at a rope's pace)
  decay_rate:
    value: 6.6667
    min: 3
    max: 12
    note: percent of full charge lost per second (6.6667 lasts 15 s from full)
  round_time:
    value: 2m
    min: 1m
    max: 4m
    note: how long a Simon round lasts before it gives up and goes back to passive
  nag_delay:
    value: 12s
    min: 6s
    max: 30s
    note: quiet time (no pulls at all) before Janis nags in a round
  encourage_every:
    value: 8s
    min: 5s
    max: 20s
    note: how often Janis encourages while a goal component is lit
  productivity_every:
    value: 15s
    min: 8s
    max: 40s
    note: how often Janis asks for productivity while no goal component has any charge
  stray_limit:
    value: 3
    min: 2
    max: 6
    note: non-goal pulls (each goal pull forgives one) before Janis is annoyed
  easy_goals:
    value: 1
    min: 1
    max: 3
  medium_goals:
    value: 2
    min: 1
    max: 4
  hard_goals:
    value: 3
    min: 2
    max: 5
  party_time:
    value: 60s
    min: 30s
    max: 90s
  final_time:
    value: 2m
    min: 1m
    max: 3m
    note: how long the purple phase lasts before the kickout

# Whole numbers the states keep. One with a reach sends <name>_reached at that count.
counters:
  stray:
    reach: $stray_limit             # non-goal pulls, less the goal ones: Janis's patience

# Percent of full per second; applies to all components.
default_decay_rate: $decay_rate

# Percent of full per pull; rope counts one pull per ~1.7 s, so 40 ≈ 3 pulls to fill.
charge_per_pull: $charge_per_pull

# The same for a purple rope: about twice the pulls to light one.
final_charge_per_pull: $final_charge_per_pull

# Overlord-only: sound every `interval` s ± `variance`.
ambient_sounds:
  - sound: audio_once_steam
    interval: 20
    variance: 1

# Only tools/balance_audio.py reads this (to produce audio_gain). Key = folder or cue; cue wins; unlisted = 1.
audio_weights:
  audio_loop: 0.6

# Overlord-only multiplier per cue; unlisted = 1.
audio_gain:
  audio_loop_idle: 0.89
  audio_once_steam: 0.6
  audio_once_component_powerup: 1  # placeholder
  audio_once_component_powerdown: 1.17  # placeholder
  audio_once_encouragement: 1.45

# CUES: every usable cue; 1-63 chars of a-z 0-9 _ - *. Unlisted cues are rejected.
cues:
  game:
    - game_reset_components
    - game_randomize_simon_1_goals
    - game_randomize_simon_2_goals
    - game_randomize_simon_3_goals
    - game_randomize_simon_4_goals
    - game_randomize_simon_5_goals
  audio_loop:
    - audio_loop_idle
    - audio_loop_off
    - diorama__audio_loop_spirit_distress   # overlord2, in the diorama
    - diorama__audio_loop_off
  audio_bed:                        # a second loop under audio_loop_*
    - audio_bed_clock_ambient
    - audio_bed_off
  video_once:
    - video_once_puppet_escape_party   # 31 s: the jailbreak, in victory2
    # Janis: wildcard per mood, then one line per file (comment = what she says).
    - video_once_janis_encouragement_*
    - video_once_janis_progress_confirmation_*
    - video_once_janis_nag_*
    - video_once_janis_suspicion_*
    - video_once_janis_warn_*
    - video_once_janis_beg_*
    - video_once_janis_anger_*
    - video_once_janis_nag_maintain_*           # asking for productivity
    - video_once_janis_suspicion_what_doing_*   # annoyed at the wrong ropes
    - video_once_janis_anger_no_*
    - video_once_janis_threatening_*
    - video_once_janis_panic_*
    # janis_encouragement (13)
    - video_once_janis_encouragement_good_work_1  # Keep up the good work.
    - video_once_janis_encouragement_rewarded_1  # If you do a good job, you will be handsomely rewarded.
    - video_once_janis_encouragement_rewarded_2  # If you do a good job, you're going to be handsomely rewarded.
    - video_once_janis_encouragement_doing_great  # You're doing great.
    - video_once_janis_encouragement_awesome_job_1  # You're doing an awesome job.
    - video_once_janis_encouragement_productivity  # We love your productivity.
    - video_once_janis_encouragement_awesome_job_2  # You're doing an awesome job.
    - video_once_janis_encouragement_keep_going  # Keep going.
    - video_once_janis_encouragement_dont_worry  # Don't worry. You're doing a good job.
    - video_once_janis_encouragement_awesome_job_3  # You're doing an awesome job.
    - video_once_janis_encouragement_good_work_2  # Keep up the good work.
    - video_once_janis_encouragement_great_job  # You're doing a great job.
    - video_once_janis_encouragement_awesome_job_4  # You're doing an awesome job.
    # janis_progress_confirmation (11)
    - video_once_janis_progress_confirmation_yes  # Yes!
    - video_once_janis_progress_confirmation_thats_it  # Yes, that's it.
    - video_once_janis_progress_confirmation_essences_1  # You're on your way to collecting the necessary essences.
    - video_once_janis_progress_confirmation_essences_2  # You're on your way to collecting the necessary essences.
    - video_once_janis_progress_confirmation_congrats_1  # Congratulations!
    - video_once_janis_progress_confirmation_celebration_1  # Please enjoy your celebration.
    - video_once_janis_progress_confirmation_pizza_1  # Pizza's on the way.
    - video_once_janis_progress_confirmation_congrats_2  # Congratulations!
    - video_once_janis_progress_confirmation_celebration_2  # Please enjoy your celebration.
    - video_once_janis_progress_confirmation_pizza_2  # Pizza's on the way!
    - video_once_janis_progress_confirmation_congrats_3  # Congratulations!
    # janis_nag (7)
    - video_once_janis_nag_thread  # Don't drop the thread.
    - video_once_janis_nag_thread_whatever  # Whatever you do, don't drop the thread.
    - video_once_janis_nag_unraveled  # Don't let things come unraveled.
    - video_once_janis_nag_maintain_1  # Maintain productivity.
    - video_once_janis_nag_maintain_2  # Please maintain productivity.
    - video_once_janis_nag_maintain_3  # Please maintain your productivity.
    - video_once_janis_nag_essences  # Keep those essences moving.
    # janis_suspicion (4)
    - video_once_janis_suspicion_deadlines  # It seems like you might be missing some of your deliverable deadlines.
    - video_once_janis_suspicion_what_doing_1  # What are you doing?
    - video_once_janis_suspicion_what_doing_2  # What are you doing?
    - video_once_janis_suspicion_what_doing_3  # What are you doing?
    # janis_warn (4)
    - video_once_janis_warn_authorized_1  # That's for authorized personnel only.
    - video_once_janis_warn_dont_go_in  # Don't go in there.
    - video_once_janis_warn_authorized_2  # That's for authorized personnel only.
    - video_once_janis_warn_dont_look  # Don't look in there.
    # janis_beg (5)
    - video_once_janis_beg_back_to_work_1  # Get back to work.
    - video_once_janis_beg_ignore_that  # Ignore that. Stay away. Get back to work.
    - video_once_janis_beg_back_to_work_2  # Get back to work.
    - video_once_janis_beg_please_work  # Please get back to work.
    - video_once_janis_beg_button  # That button has been disabled. Now get back to work.
    # janis_anger (3)
    - video_once_janis_anger_no_1  # No!
    - video_once_janis_anger_no_2  # No!
    - video_once_janis_anger_stop_it  # Stop it. Get out of there.
    # janis_threatening (4)
    - video_once_janis_threatening_disciplinary_1  # If you don't return to work, it may result in disciplinary action.
    - video_once_janis_threatening_disciplinary_2  # If you don't... if you don't return to work, it may result in disciplinary action.
    - video_once_janis_threatening_disciplinary_3  # If you don't return to work, it may result in disciplinary action.
    - video_once_janis_threatening_disciplined  # Please maintain productivity and get back to work or you will be disciplined.
    # janis_panic (5)
    - video_once_janis_panic_imminent  # Disciplinary action is imminent.
    - video_once_janis_panic_terminated  # If you don't stop immediately, you will be terminated.
    - video_once_janis_panic_unraveled  # Things will come unraveled if you continue.
    - video_once_janis_panic_sabotaging  # You're sabotaging our productivity.
    - video_once_janis_panic_immediately  # Get back to work immediately.
  audio_once:
    - audio_once_steam
    - audio_once_level_up
    # Lever sound per colour, sent by the arbiter on pulls (components.cpp).
    - audio_once_lever_red
    - audio_once_lever_blue
    - audio_once_lever_green
    - audio_once_lever_yellow
    - audio_once_lever_orange
    - audio_once_lever_purple
    # Error sound per colour, played in a round when a lever that is not a goal is pulled.
    - audio_once_lever_red_error
    - audio_once_lever_blue_error
    - audio_once_lever_green_error
    - audio_once_lever_yellow_error
    - audio_once_lever_orange_error
    - audio_once_lever_purple_error
    - audio_once_component_powerup  # placeholder
    - audio_once_component_powerdown  # placeholder
    - audio_once_encouragement
    - audio_once_progress_confirmation
    - audio_once_corporate_approval
    - audio_once_productivity_score_rises
    - audio_once_victory_fanfare
    - audio_once_revelation_stinger
    - audio_once_spirit_distress
    - audio_once_spirit_forced_labor
    - audio_once_janis_suspicion
    - audio_once_janis_anger
    - audio_once_spirit_encouragement
    - audio_once_janis_threatening
    - audio_once_cage_unlocking
    - audio_once_victory_liberation
    - audio_once_overlord_defeat
    - audio_once_machine_shutdown
    - audio_once_idle_return_cue
    - audio_once_spirits_denied       # placeholder: the big bad noise when "free the spirits" is pressed
  video_loop:
    - video_loop_idle
    - video_loop_game1
    - video_loop_network_idle       # 5 s, in final
  text_show:                        # a message from `messages:`, shown over the Overlord's video
    - text_show_afterword

# MESSAGES: text for text_show_<name> cues. Overlord only. seconds = how long it stays.
messages:
  afterword:
    text: "Thanks for playing, please relatch the diorama on your way out!"
    seconds: 30

# Flow: passive -> easy_round -> medium_round -> hard_round -> party -> diorama_unlocked -> final -> victory2 -> kickout -> passive
#
# Story: ropes are levers extracting spirit souls for Janis. Party opens the diorama at
# 10 s; its "free the spirits" button is fake (purple flash, bad noise, Janis disables it).
# Real way out: light all purple ropes in the final.
# Fragments the three rounds share (YAML anchors: `<<: *round_on` merges a map in).
# The arbiter never sees this section; the anchors are already resolved in its JSON.
shared:
  round_on: &round_on
    # A lever that is not a goal sounds its own error, over the arbiter's lever sound.
    # Purple is never a goal in a round; in `final` it is the goal and has none of this.
    nongoal_red_pull:    { cue: [audio_once_lever_red_error] }
    nongoal_blue_pull:   { cue: [audio_once_lever_blue_error] }
    nongoal_green_pull:  { cue: [audio_once_lever_green_error] }
    nongoal_yellow_pull: { cue: [audio_once_lever_yellow_error] }
    nongoal_orange_pull: { cue: [audio_once_lever_orange_error] }
    final_pull:          { cue: [audio_once_lever_purple_error] }
    # Janis's patience: each non-goal pull is a strike, each goal pull forgives one.
    nongoal_pull:
      add: { stray: 1 }
    goal_pull:
      add: { stray: -1 }
    stray_reached:
      clear: [stray]
      cue:
        - choose_one:
            - video_once_janis_suspicion_what_doing_*   # What are you doing?
            - video_once_janis_anger_no_*               # No!
  round_every: &round_every
    - delay: $encourage_every         # keeps cheering while a goal is lit
      if: goal_active
      cue:
        - video_once_janis_encouragement_*
    - delay: $productivity_every      # nothing on the goals, whatever else is going on
      if: no_goal_charge
      cue:
        - video_once_janis_nag_maintain_*

# Janis: encourages correct goals, nags when idle, warn/beg/anger at purple by round;
# final = threats idle, panic at purple, ignores majors. Placeholder = timing not final.
states:

  passive:
    on:
      enter:
        set:                          # the game is back at its start
          diorama.lights: dark
          diorama.latch: locked
          party.lights: dark
          queue.sign: enter           # nobody inside: let the next group in
        cue:
          - diorama__audio_loop_off   # leaving diorama_unlocked, however we got here: the distress stops
          - diorama__audio_loop_off   # leaving diorama_unlocked, however we got here: the distress stops
          - game_reset_components     # the round's lit components go dark
          - audio_loop_idle
          - audio_bed_clock_ambient   # stays on until victory2
          - video_loop_idle
      # First pull starts the game (not purple); its charge lands in easy_round. No powerup sound.
      goal_pull:
        cue:
          - video_once_janis_encouragement_*
        goto: easy_round
      nongoal_pull:
        cue:
          - video_once_janis_encouragement_*
        goto: easy_round

  easy_round:
    on:
      <<: *round_on
      enter:
        clear: [stray]
        set: { queue.sign: wait, diorama.latch: locked }   # a group is in; the sign stays wait until passive
        goals: $easy_goals            # deal this many goal colours
        cue:
          - diorama__audio_loop_off   # leaving diorama_unlocked, however we got here: the distress stops
          - game_reset_components
          - video_loop_game1
      goal_component_activated:
        cue:
          - audio_once_component_powerup
          - video_once_janis_encouragement_*
      component_deactivated:
        cue:
          - audio_once_component_powerdown
      final_component_activated:
        cue:
          - video_once_janis_warn_*
      all_components_activated:
        goto: medium_round
    idle:
      delay: $nag_delay
      cue:
        - video_once_janis_nag_*
    every: *round_every
    after:
      delay: $round_time
      goto: passive

  medium_round:
    on:
      <<: *round_on
      enter:
        clear: [stray]
        set: { diorama.latch: locked }
        goals: $medium_goals
        cue:
          - diorama__audio_loop_off   # leaving diorama_unlocked, however we got here: the distress stops
          - game_reset_components
          - audio_once_level_up
          - video_loop_game1
          - choose_one:               # the round just won; on enter so it cuts
              - video_once_janis_progress_confirmation_yes        # off the last
              - video_once_janis_progress_confirmation_thats_it   # encouragement
              - video_once_janis_progress_confirmation_essences_1
              - video_once_janis_progress_confirmation_essences_2
      goal_component_activated:
        cue:
          - audio_once_component_powerup
          - video_once_janis_encouragement_*
      component_deactivated:
        cue:
          - audio_once_component_powerdown
      final_component_activated:
        cue:
          - video_once_janis_beg_*
      all_components_activated:
        goto: hard_round
    idle:
      delay: $nag_delay
      cue:
        - video_once_janis_nag_*
    every: *round_every
    after:
      delay: $round_time
      goto: passive

  hard_round:
    on:
      <<: *round_on
      enter:
        clear: [stray]
        set: { diorama.latch: locked }
        goals: $hard_goals
        cue:
          - diorama__audio_loop_off   # leaving diorama_unlocked, however we got here: the distress stops
          - game_reset_components
          - audio_once_level_up
          - video_loop_game1
          - choose_one:               # the round just won; on enter so it cuts
              - video_once_janis_progress_confirmation_yes        # off the last
              - video_once_janis_progress_confirmation_thats_it   # encouragement
              - video_once_janis_progress_confirmation_essences_1
              - video_once_janis_progress_confirmation_essences_2
      goal_component_activated:
        cue:
          - audio_once_component_powerup
          - video_once_janis_encouragement_*
      component_deactivated:
        cue:
          - audio_once_component_powerdown
      final_component_activated:
        cue:
          - video_once_janis_anger_*
      all_components_activated:
        goto: party
    idle:
      delay: $nag_delay
      cue:
        - video_once_janis_nag_*
    every: *round_every
    after:
      delay: $round_time
      goto: passive

  # Celebration; enter cues cut each other off, so chatter comes from idle.
  party:
    on:
      enter:
        set:
          party.lights: lit
          diorama.latch: locked       # until the 10 s step opens it
        cue:
          - diorama__audio_loop_off   # leaving diorama_unlocked, however we got here: the distress stops
          - audio_once_victory_fanfare
          - choose_one:
              - video_once_janis_progress_confirmation_congrats_1
              - video_once_janis_progress_confirmation_congrats_2
              - video_once_janis_progress_confirmation_congrats_3
      diorama.door_opened:            # someone is looking in
        cue:
          - choose_one:
              - video_once_janis_warn_dont_go_in   # Don't go in there.
              - video_once_janis_warn_dont_look    # Don't look in there.
      diorama.button_pressed:         # "free the spirits": it was never going to work
        cue:
          - audio_once_spirits_denied
          - video_once_janis_beg_button   # That button has been disabled. Now get back to work.
    at:
      10s:                          # the diorama comes on 10 s into the celebration
        set:
          diorama.lights: creepy
          diorama.latch: open
    idle:
      delay: 12s                    # placeholder
      cue:
        - choose_one:
            - video_once_janis_progress_confirmation_celebration_1
            - video_once_janis_progress_confirmation_celebration_2
            - video_once_janis_progress_confirmation_pizza_1
            - video_once_janis_progress_confirmation_pizza_2
    after:
      delay: $party_time
      goto: diorama_unlocked

  # The diorama is open and the spirits cry out (overlord2) until someone pulls a purple rope.
  diorama_unlocked:
    on:
      enter:
        set: { diorama.latch: open }   # open here however we got here
        cue:
          - diorama__audio_loop_spirit_distress
      diorama.door_opened:
        cue:
          - choose_one:
              - video_once_janis_warn_dont_go_in
              - video_once_janis_warn_dont_look
      diorama.button_pressed:
        cue:
          - audio_once_spirits_denied
          - video_once_janis_beg_button
      final_component_activated:
        goto: final
    idle:
      delay: 12s                    # placeholder
      cue:
        - video_once_janis_threatening_*


  # Only purple matters; majors unlisted = ignored.
  final:
    on:
      enter:
        set:
          party.lights: dark          # the victory is over
          diorama.latch: locked
        cue:
          - video_loop_network_idle
          - diorama__audio_loop_off   # the distress stops
          - game_reset_components
          - video_once_janis_threatening_*
      final_component_activated:
        cue:
          - video_once_janis_panic_*
      diorama.door_opened:
        cue:
          - choose_one:
              - video_once_janis_warn_dont_go_in
              - video_once_janis_warn_dont_look
              - video_once_janis_anger_stop_it     # Stop it. Get out of there.
      diorama.button_pressed:
        cue:
          - audio_once_spirits_denied
          - choose_one:
              - video_once_janis_beg_button
              - video_once_janis_anger_no_1
              - video_once_janis_anger_no_2
      all_final_components_activated:
        goto: victory2
    idle:
      delay: 20s                    # placeholder
      cue:
        - video_once_janis_threatening_*
    after:
      delay: $final_time
      goto: kickout

  victory2:
    on:
      enter:
        set:
          diorama.lights: paradise    # the spirits have made it to paradise
          diorama.latch: locked
          party.lights: lit
        cue:
          - diorama__audio_loop_off   # leaving diorama_unlocked, however we got here: the distress stops
          - audio_bed_off
          - video_once_puppet_escape_party
    at:                            # sounds over the jailbreak video; tune to the picture
      4s:
        cue:
          - audio_once_cage_unlocking
      7s:
        cue:
          - audio_once_victory_liberation
    after:
      delay: 32s                   # the jailbreak video is 31 s
      goto: afterword

  afterword:
    on:
      enter:
        set: { diorama.latch: locked }
        cue:
          - text_show_afterword
    after:
      delay: 30s
      goto: kickout

  kickout:
    on:
      enter:
        set:
          diorama.lights: dark
          diorama.latch: locked
          party.lights: dark
        cue:
          - audio_loop_off
          - audio_bed_off
          - diorama__audio_loop_off
    after:
      delay: 2m                    # placeholder
      goto: passive
