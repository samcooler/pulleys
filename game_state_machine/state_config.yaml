# Example game. Format reference: GAME_FORMAT.md
#
# GLOSSARY
#   cue          Something the panel does: play a sound, play a video clip, or
#                switch the background music or video. The name starts with its
#                kind, and the whole name is the file name in overlord/media/
#                (the part after the kind also works):
#                  audio_loop_*  background music; repeats until changed
#                  audio_once_*  a short sound effect played on top of everything
#                  video_loop_*  background video; repeats until changed
#                  video_once_*  a short video that plays once on screen
#   event        Something that happens in the world, which a state can react to:
#                  first_goal_component_activated  A goal activates while no goal is lit.
#                  goal_component_activated     A goal component is activated.
#                  nongoal_component_activated  A major component outside the goal set is activated.
#                  component_deactivated       One of the major components is deactivated.
#                  all_components_activated    All goals lit; every non-goal dark.
#                  all_components_deactivated  Every major component is now deactivated.
#                  final_component_activated   The final component is activated.
#                  final_component_deactivated The final component is deactivated.
#                  all_final_components_activated  Every final component is now activated.
#   state        What the game is doing right now. It is always in exactly one.
#   on           What to do when a state is entered or an event happens in it.
#                An event a state does not list is ignored.
#   enter        Cues to fire the moment the game arrives in a state.
#   cue (in on)  Cues to fire for that event.
#   goto         The state to move to.
#   after        Move to another state once this much time has passed.
#   component    One of the pieces of the installation that players activate: five
#                major ones and three final ones, each driven by one rope channel.
#   decay rate   Percent of full charge a lit component loses per second.
#   ambient      A sound overlord repeats on a schedule, independent of the game.
#   gain         A multiplier on how loud one audio clip plays. 1 is unchanged.
#   placeholder  Media that does not exist yet.

game: pulley-party
start: passive

# Which rope channel drives each component. The position in a list is the
# component's number, so the first `major` entry is major component 1. There are
# always five major and three final components, each on its own channel (0-15).
# A channel not listed here drives nothing. The arbiter reads this; it also fixes
# the order of the bars on the component state display.
components:
  major:
    - 1
    - 10
    - 3
    - 4
    - 5
  final:
    - 6
    - 7
    - 8

# How fast a lit component drains, in percent of full per second. A pull sets a
# component to 100 and it goes dark at 0, so it stays lit 100 / rate seconds:
# 6.6667 is 15 seconds. The arbiter owns this, and publishes it to the component
# state displays along with each component's charge. It applies to every
# component (hence "default").
default_decay_rate: 6.6667

# Sounds overlord plays on its own, forever, whatever state the game is in.
# Only overlord reads this; the arbiter never sees it. Each entry plays its
# sound every `interval` seconds, give or take up to `variance` seconds (picked
# fresh each time), so 5 and 1 plays every 4 to 6 seconds.
ambient_sounds:
  - sound: audio_once_steam
    interval: 20
    variance: 1

# How loud clips should be relative to each other. Read ONLY by
# tools/balance_audio.py, which uses it to work out audio_gain below; no device
# reads it. A key is a whole folder (audio_loop, audio_once) or one cue
# (audio_loop_idle), and the cue wins over its folder. Unlisted is 1, so 0.6
# puts a clip at 60% of the loudness the others are balanced to.
audio_weights:
  audio_loop: 0.6

# How loud each audio clip plays, as a multiplier on the file's own level (on
# top of the volume setting): 1.2 is 20% louder, 0.8 is 80% as loud. Optional;
# a cue not listed plays at 1. Only overlord reads this. Keys are cue names.
audio_gain:
  audio_loop_idle: 0.89
  audio_once_steam: 0.6
  audio_once_component_powerup: 1  # placeholder
  audio_once_component_powerdown: 1.17  # placeholder
  audio_once_encouragement: 1.45

# CUES
#   Cues travel over the mesh as their name in ASCII, e.g. audio_once_chime,
#   so a name has to fit one packet: 1 to 47 characters, lowercase letters,
#   digits, _ and -. This block lists every cue the game may use; a state that
#   fires a cue not listed here is rejected. Order does not matter.
cues:
  game:
    - game_reset_components
    - game_randomize_simon_1_goals
    - game_randomize_simon_2_goals
    - game_randomize_simon_3_goals
    - game_randomize_simon_4_goals
    - game_randomize_simon_5_goals
  audio_loop:
    - audio_loop_idle
    - audio_loop_off
  video_once:
    - video_once_test1
    - video_once_test2
    - video_once_encouragement      # placeholder
  audio_once:
    - audio_once_steam
    - audio_once_component_powerup  # placeholder
    - audio_once_component_powerdown  # placeholder
    - audio_once_encouragement
    - audio_once_progress_confirmation
    - audio_once_corporate_approval
    - audio_once_productivity_score_rises
    - audio_once_victory_fanfare
    - audio_once_revelation_stinger
    - audio_once_spirit_distress
    - audio_once_spirit_forced_labor
    - audio_once_janis_suspicion
    - audio_once_janis_anger
    - audio_once_spirit_encouragement
    - audio_once_janis_threatening
    - audio_once_cage_unlocking
    - audio_once_victory_liberation
    - audio_once_overlord_defeat
    - audio_once_machine_shutdown
    - audio_once_idle_return_cue
  video_loop:
    - video_loop_idle
    - video_loop_game1

# Flow: passive -> easy_round -> medium_round -> hard_round -> victory1 -> reveal -> phase2 -> victory2 -> kickout -> passive
# Delays marked placeholder are not final timings yet.
states:

  passive:
    on:
      enter:
        cue:
          - audio_loop_idle
          - video_loop_idle
      nongoal_component_activated:
        cue:
          - audio_once_component_powerup
          - audio_once_encouragement
          - video_once_encouragement
        goto: easy_round

  easy_round:
    on:
      enter:
        cue:
          - game_reset_components
          - game_randomize_simon_2_goals
          - video_loop_game1
      first_goal_component_activated:
        cue:
          - audio_once_encouragement
          - video_once_encouragement
      goal_component_activated:
        cue:
          - audio_once_component_powerup
      component_deactivated:
        cue:
          - audio_once_component_powerdown
      all_components_activated:
        goto: medium_round
    after:
      delay: 2m                     # placeholder
      goto: passive

  medium_round:
    on:
      enter:
        cue:
          - game_reset_components
          - game_randomize_simon_3_goals
          - video_loop_game1
      first_goal_component_activated:
        cue:
          - audio_once_encouragement
          - video_once_encouragement
      goal_component_activated:
        cue:
          - audio_once_component_powerup
      component_deactivated:
        cue:
          - audio_once_component_powerdown
      all_components_activated:
        goto: hard_round
    after:
      delay: 2m                     # placeholder
      goto: passive

  hard_round:
    on:
      enter:
        cue:
          - game_reset_components
          - game_randomize_simon_5_goals
          - video_loop_game1
      first_goal_component_activated:
        cue:
          - audio_once_encouragement
          - video_once_encouragement
      goal_component_activated:
        cue:
          - audio_once_component_powerup
      component_deactivated:
        cue:
          - audio_once_component_powerdown
      all_components_activated:
        goto: victory1
    after:
      delay: 2m                     # placeholder
      goto: passive

  victory1:
    on:
      enter:
        cue:
          - video_once_test2
    after:
      delay: 10s
      goto: reveal

  reveal:
    on:
      enter:
        cue:
          - video_once_test1
    after:
      delay: 10s                    # placeholder
      goto: phase2

  phase2:
    on:
      enter:
        cue:
          - game_reset_components
      final_component_activated:
        cue:
          - audio_once_component_powerup
          - video_once_encouragement
      final_component_deactivated:
        cue:
          - audio_once_component_powerdown
      all_final_components_activated:
        goto: victory2
    after:
      delay: 2m                     # placeholder
      goto: kickout

  victory2:
    on:
      enter:
        cue:
          - video_once_test2
    after:
      delay: 2m                    # placeholder
      goto: kickout

  kickout:
    on:
      enter:
        cue:
          - audio_loop_off
    after:
      delay: 2m                    # placeholder
      goto: passive
